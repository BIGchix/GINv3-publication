[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gin-multomics"
version = "0.2.0"
description = "Global Integrative Network (GIN) multi-omics toolkit: context extraction and SigPN (signaling Petri net; not stochastic PN), with GINv3.11a p53 recipes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "networkx>=3.2",
]

[project.optional-dependencies]
sim = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["gin_tool*", "scbionet*"]

[tool.setuptools.package-data]
"gin_tool.subgraph_pipeline" = ["data/*.json"]

[project.scripts]
gin-multomics = "gin_tool.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
